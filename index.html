<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orientácia – celky Slovenska</title>
<meta name="description" content="Učebná appka z geografie: geomorfologické celky Slovenska na slepej mape. Lekcie po oblastiach a test – appka ukáže miesto, ty napíšeš názov.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orientácia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  /* svetly vzhlad ako politologia: modra = hlavna farba, kazda lekcia ma svoju farbu (--tc),
     na mape: oranzova = na co sa pyta, zelena = spravne, cervena = zle, srafovane = netreba */
  :root{
    --bg:#f2f4f8;
    --card:#ffffff;
    --line:#e2e6ee;
    --ink:#12141a;
    --muted:#5d6577;
    --faint:#9aa1ae;
    --ok:#13803b;
    --ok-soft:#e8f6ed;
    --bad:#c52a1f;
    --bad-soft:#fcedeb;
    --warn:#8a5a00;
    --warn-soft:#fff6dc;
    --target:#ff8a3d;
    --tc:#2349d8;
    --tsoft:#e2e9ff;
    --font:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button,input{font-family:inherit;}
  .wrap{
    max-width:720px;margin:0 auto;min-height:100vh;
    padding:12px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    padding-top:max(12px, env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:14px;
  }
  h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin:0;}
  h2{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.2px;margin:0;text-wrap:balance;}
  p{margin:0;}
  b{font-weight:700;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .label{font-size:12.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(18,20,26,.05);display:flex;flex-direction:column;gap:12px;}
  .center{text-align:center;align-items:center;}

  /* ---- tlacidla ---- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:52px;padding:8px 18px;border:none;border-radius:14px;cursor:pointer;
    background:var(--tc);color:#fff;font-size:17px;font-weight:700;text-align:center;line-height:1.25;
  }
  .btn.soft{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:16px;}
  .btn[hidden]{display:none;}
  .back{
    height:44px;padding:0 12px 0 4px;margin-left:-6px;border:none;background:transparent;border-radius:10px;
    display:flex;align-items:center;gap:2px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;
  }
  .chip{
    height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;
  }
  .chip input{width:18px;height:18px;margin:0;accent-color:var(--tc);}
  .linkbtn{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--tc);cursor:pointer;white-space:nowrap;}

  /* ---- hlavicka ---- */
  .top{display:flex;align-items:center;gap:8px;min-height:44px;}
  .top .sp{flex:1;}
  .brand{display:flex;flex-direction:column;line-height:1.25;}
  .brand b{font-size:22px;font-weight:800;letter-spacing:-.3px;}
  .brand span{font-size:14px;color:var(--muted);}
  .count{font-weight:700;font-size:15px;color:var(--muted);}
  .pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:-6px;}
  .pbar span{display:block;height:6px;background:var(--tc);border-radius:999px;transition:width .3s;}
  .steps{display:flex;gap:6px;font-size:13px;font-weight:700;color:var(--faint);}
  .steps span.on{color:var(--tc);}

  /* ---- domov ---- */
  .tcard{flex-direction:row;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-size:16px;padding:14px 16px;}
  .tbadge{flex:0 0 40px;height:40px;border-radius:12px;background:var(--tc);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .tcard .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .tcard .tt{font-weight:700;font-size:17px;line-height:1.25;}
  .tcard .ts{font-size:14px;color:var(--muted);line-height:1.35;}
  .tcard .score{font-weight:800;font-size:15px;color:var(--ok);}
  .lbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;}
  .lbar span{display:block;height:6px;border-radius:999px;background:var(--tc);}
  .chev{flex:0 0 18px;color:var(--faint);}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #9aa1ae;vertical-align:-2px;margin-right:5px;}
  .legend i.need{background:#fff;}
  .legend i.off{background:repeating-linear-gradient(45deg,#e9ecf1 0 3px,#cfd4dc 3px 5px);}
  .fix{gap:10px;}
  .fix li{margin:0;line-height:1.45;}
  .fix ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;}
  .foot{text-align:center;padding:4px 8px 0;}

  /* ---- mapa ---- */
  .mapbox{position:relative;width:100%;border-radius:16px;background:#f7f9fc;border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  .mapbox > svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
  .mapbox.static{touch-action:auto;}
  .mapbox.static > svg{pointer-events:none;}
  .u{fill:#fff;stroke:#3a4152;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .18s;cursor:pointer;}
  .u.les{fill:var(--tsoft);}
  .u.found{fill:#c6edd3;}
  .u.sel{fill:#ffd23f;}
  .u.target{fill:var(--target);}
  .u.ok{fill:#5cc27f;}
  .u.bad{fill:#f07a6c;}
  .lbl{font-weight:800;fill:#12141a;paint-order:stroke;stroke:#fff;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .ring{fill:none;stroke:#e8590c;stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.25;}}
  /* vlavo hore je nad Slovenskom prazdne miesto (Cesko), tlacidla tam nic nezakryju */
  .mapctl{position:absolute;left:8px;top:8px;display:flex;gap:6px;}
  .mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.94);font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px;margin:-6px 0 -8px;}

  /* ---- info o celku ---- */
  .info{min-height:64px;justify-content:center;gap:6px;}
  .uhead{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;min-width:34px;height:30px;padding:0 8px;border-radius:9px;background:var(--tc);color:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;}
  .num.off{background:#c3c8d1;}
  .uname{font-weight:800;font-size:19px;line-height:1.2;}
  .hint{font-size:14.5px;color:var(--muted);line-height:1.4;}
  .hint::before{content:"Pomôcka: ";font-weight:700;color:var(--muted);}
  .list{display:flex;flex-direction:column;gap:8px;}
  .item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink);font-size:16px;width:100%;}
  .item .tx{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .item b{font-size:17px;}
  .item.on{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc) inset;}

  /* ---- otazky ---- */
  .q{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.3px;}
  .answer input{
    width:100%;height:54px;border-radius:14px;border:1.5px solid #c9cfda;background:#fff;padding:0 14px;
    font-size:19px;font-weight:600;color:var(--ink);outline:none;
  }
  .answer input:focus{border-color:var(--tc);box-shadow:0 0 0 3px var(--tsoft);}
  .answer input[readonly]{background:#f7f8fa;}
  .fb:empty{display:none;}
  .fb{display:flex;flex-direction:column;gap:6px;}
  .good,.badfb,.warnfb{border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.4;}
  .good{background:var(--ok-soft);color:var(--ok);}
  .badfb{background:var(--bad-soft);color:var(--bad);}
  .warnfb{background:var(--warn-soft);color:var(--warn);}
  .good b,.badfb b{color:var(--ink);}

  /* ---- vysledok ---- */
  .grade{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;background:var(--ok);}
  .grade.g3{background:#d39b00;}
  .grade.g4,.grade.g5{background:var(--bad);}
  .mist{display:flex;flex-direction:column;gap:8px;}
</style>
</head>

<div id="app" class="wrap"></div>

      else if (pts.size === 2) { const [a, b] = [...pts.values()]; g = { type: "pinch", d0: dist(a, b) || 1, m0: mid(a, b), v: Object.assign({}, view) }; }
    });
    svg.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId) || !g) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const r = svg.getBoundingClientRect(), k = g.v.w / r.width;
      if (g.type === "tap" || g.type === "pan") {
        const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
        if (g.type === "tap" && Math.hypot(dx, dy) > 8) g.type = "pan";
        if (g.type === "pan") setView({ x: g.v.x - dx * k, y: g.v.y - dy * k, w: g.v.w, h: g.v.h });
      } else if (g.type === "pinch" && pts.size >= 2) {
        const [a, b] = [...pts.values()], m = mid(a, b);
        const F = full();
        const w = Math.min(F.w, Math.max(F.w / 14, g.v.w / (dist(a, b) / g.d0))), h = w * aspect;
        const px = g.v.x + (g.m0.x - r.left) * k, py = g.v.y + (g.m0.y - r.top) * k, k2 = w / r.width;
        setView({ x: px - (m.x - r.left) * k2, y: py - (m.y - r.top) * k2, w, h });
      }
    });
    const end = e => {
      const tap = g && g.type === "tap" && pts.size === 1 && Date.now() - g.t < 700;
      pts.delete(e.pointerId);
      if (tap && e.type === "pointerup" && o.onTap) o.onTap(hit(e.clientX, e.clientY));
      if (pts.size === 0) g = null;
      else { const p = [...pts.values()][0]; g = { type: "pan", sx: p.x, sy: p.y, t: 0, v: Object.assign({}, view) }; }
    };
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", end);
    svg.addEventListener("wheel", e => {
      e.preventDefault();
      const r = svg.getBoundingClientRect(), k = view.w / r.width;
      const f = Math.exp(-e.deltaY * 0.0015), F = full();
      const w = Math.min(F.w, Math.max(F.w / 14, view.w / f)), h = w * aspect;
      const px = view.x + (e.clientX - r.left) * k, py = view.y + (e.clientY - r.top) * k, k2 = w / r.width;
      setView({ x: px - (e.clientX - r.left) * k2, y: py - (e.clientY - r.top) * k2, w, h });
    }, { passive: false });
    if (o.controls !== false) {
      const c = document.createElement("div");
      c.className = "mapctl";
      c.innerHTML = '<button type="button" aria-label="Zväčšiť mapu">+</button><button type="button" aria-label="Oddialiť">−</button><button type="button" aria-label="Celá mapa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>';
      const [bp, bm, bh] = c.querySelectorAll("button");
      bp.onclick = () => zoomBy(1.6);
      bm.onclick = () => zoomBy(1 / 1.6);
      bh.onclick = () => setView(homeView(), true);
      c.addEventListener("pointerdown", e => e.preventDefault());
      box.append(c);
    }
  }
  window.addEventListener("resize", apply);

  const api = {
    el: box,
    home(anim){ setView(homeView(), anim); },
    zoomTo,
    cls(n, c, on){ P[n].classList.toggle(c, on !== false); },
    clear(){ for (const n in P) P[n].classList.remove("les", "found", "sel", "target", "ok", "bad"); },
    clearCls(c){ for (const n in P) P[n].classList.remove(c); },
    numbers(list){
      gL.textContent = "";
      (list || []).forEach(n => { const u = U[n]; const t = sv("text", { x: u.lx, y: u.ly, class: "lbl" }); t.textContent = n; gL.append(t); });
    },
    ring(n){
      gM.textContent = ""; ringN = n; ringEl = null;
      if (n == null) return;
      ringEl = sv("circle", { cx: U[n].lx, cy: U[n].ly, class: "ring" });
      gM.append(ringEl); apply();
    },
    refresh(){ apply(); }
  };
  view = homeView();
  return api;
}
function mount(el, map, after){ el.append(map.el); requestAnimationFrame(() => { map.home(false); if (after) after(); }); }

/* ================= kontrola odpovede ================= */
function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function lev(a, b){
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const ALIAS = { 35: ["vysoke tatry"] };
function judge(input, u){
  const a = norm(input), b = norm(u.name);
  if (a === b) return "ok";
  if ((ALIAS[u.n] || []).indexOf(a) >= 0) return "alias";
  const tol = b.length >= 16 ? 2 : (b.length >= 7 ? 1 : 0);
  const d = lev(a, b);
  // preklep sa uzna, len ak odpoved nie je rovnako blizko nazvu ineho celku (Oravska vs. Ondavska vrchovina)
  if (tol && d <= tol && !DATA.units.some(x => x.n !== u.n && lev(a, norm(x.name)) <= d)) return "typo";
  const w = b.split(" ");
  if (w.length > 1 && a === w[0]) return "partial";
  return "wrong";
}
function gradeOf(p){ return p >= 0.9 ? 1 : p >= 0.75 ? 2 : p >= 0.5 ? 3 : p >= 0.3 ? 4 : 5; }

function writeQuiz(o){
  // o: {units, fit, aspect, header, onDone(res)}
  app.innerHTML = `
    <header class="top"><button class="back" id="bk">‹ Domov</button><div class="sp"></div>${o.header}</header>

      <label class="q" for="inp" style="font-size:19px">Ako sa volá oranžový celok?</label>
      <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="go" placeholder="Napíš názov…">
      <div class="fb" id="fb"></div>
      <div class="row"><button type="button" class="btn soft" id="idk">Neviem</button><button type="submit" class="btn" id="ok">Skontrolovať</button></div>
    </form>`;
  $("#bk").onclick = () => history.back();
  const inp = $("#inp"), fb = $("#fb"), okb = $("#ok"), idk = $("#idk"), f = $("#f");
  const total = o.units.length;
  let q = shuffle(o.units), idx = 0, cur = null, state = "ask";
  const first = new Map(), again = new Map();
  const m = createMap({ aspect: o.aspect, fit: o.fit });
  mount($("#mw"), m);
  if ($("#zm")) $("#zm").onclick = () => m.zoomTo(cur);
  [okb, idk].forEach(b => b.addEventListener("pointerdown", e => e.preventDefault())); // klavesnica ostane otvorena
  function ask(){
    if (idx >= q.length) return finish();
    cur = q[idx];
    m.clearCls("target"); m.clearCls("ok"); m.clearCls("bad");
    m.cls(cur, "target"); m.ring(cur);
    m.home(true);
    const done = Math.min(idx, total);
    $("#cnt").textContent = idx < total ? `${idx + 1} / ${total}` : "Opakovanie chýb";
    $("#pb").style.width = (done / total * 100) + "%";
    inp.value = ""; inp.readOnly = false; fb.innerHTML = "";
    okb.textContent = "Skontrolovať"; idk.hidden = false; state = "ask";
  }
  function reveal(ok, kind){
    const u = U[cur];
    if (!first.has(cur)) first.set(cur, ok);
    if (ok) {
      m.cls(cur, "target", false); m.cls(cur, "ok");
      const note = kind === "typo" ? ` <span class="small">(pozor na pravopis)</span>` : kind === "alias" ? ` <span class="small">(na písomku stačí „Tatry“)</span>` : "";
      fb.innerHTML = `<div class="good">✓ Správne! <b>${esc(u.name)}</b>${note}</div><p class="hint">${esc(u.h)}</p>`;
    } else {
      const c = (again.get(cur) || 0);
      if (c < 2) { again.set(cur, c + 1); q.push(cur); }
      fb.innerHTML = `<div class="badfb">Správne je: <b>${esc(u.name)}</b> <span class="small">(č. ${u.n})</span></div><p class="hint">${esc(u.h)}</p>`;
    }
    inp.readOnly = true; okb.textContent = "Ďalej"; idk.hidden = true; state = "fb";
  }
  function check(){
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    const r = judge(v, U[cur]);
    if (r === "partial") { fb.innerHTML = `<div class="warnfb">Napíš celý názov – chýba druhé slovo.</div>`; return; }
    reveal(r === "ok" || r === "typo" || r === "alias", r);
  }
  f.onsubmit = e => { e.preventDefault(); if (state === "ask") check(); else { idx++; ask(); } };
  idk.onclick = () => { if (state === "ask") reveal(false, "idk"); };
  function finish(){
    let correct = 0; const wrong = [];
    o.units.forEach(n => { if (first.get(n)) correct++; else wrong.push(n); });
    o.onDone({ total, correct, wrong });
  }
  ask();
}
function lessonWrite(i){

    header: stepsBar(3),
    onDone: res => {
      const p = res.correct / res.total, s = ST.les[i] || {};
      ST.les[i] = { best: Math.max(s.best || 0, p) }; save();
      go(() => result({ title: `Lekcia ${i + 1}: ${l.t}`, res, again: () => lessonLook(i), next: i + 1 < DATA.lessons.length ? () => { setTheme(i + 1); lessonLook(i + 1); } : null, nextLabel: i + 1 < DATA.lessons.length ? `Lekcia ${i + 2}: ${DATA.lessons[i + 1].t}` : "" }));
    }
  });
}
function bigTest(kind){

    onDone: res => {
      const p = res.correct / res.total;
      ST.test[kind] = Math.max(ST.test[kind] || 0, p); save();
      go(() => result({ title: kind === "all" ? "Veľký test" : "Rýchly test", res, again: () => bigTest(kind), next: kind === "quick" ? () => bigTest("all") : null, nextLabel: "Veľký test – všetkých 58" }));
    }
  });
}

/* ================= vysledok ================= */
function result(o){
  const r = o.res, p = r.correct / r.total, g = gradeOf(p);
  app.innerHTML = `
    <header class="top"><button class="back" id="bk">‹ Domov</button></header>
    <section class="card center">
      <span class="label">${esc(o.title)}</span>
      <div class="grade g${g}">${g}</div>
      <h2>${r.correct} / ${r.total} správne na prvý pokus</h2>
      <p class="muted">${Math.round(p * 100)} %${r.wrong.length ? " – chyby si appka hneď zopakovala, ale tu ich máš ešte raz:" : " – bez chyby!"}</p>
    </section>
    ${r.wrong.length ? `<div class="mist">${r.wrong.map(n => `<div class="item" style="cursor:default"><span class="num">${n}</span><span class="tx"><b>${esc(U[n].name)}</b><span class="hint">${esc(U[n].h)}</span></span></div>`).join("")}</div>` : ""}
    <div class="stack">
      ${o.next ? `<button class="btn" id="nx">Ďalej: ${esc(o.nextLabel)}</button>` : ""}
      <button class="btn soft" id="ag">Zopakovať</button>
      <button class="btn soft" id="hm">Domov</button>
    </div>`;
  $("#bk").onclick = () => history.back();
  $("#hm").onclick = () => history.back();
  $("#ag").onclick = () => go(o.again);
  if (o.next) $("#nx").onclick = () => go(o.next);
}

history.replaceState({ s: 0 }, "");
home();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
